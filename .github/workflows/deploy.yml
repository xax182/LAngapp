# Testy + publikacja aplikacji na GitHub Pages po każdej zmianie w gałęzi main.
name: Testy i publikacja

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Import fraz zapisuje zmiany tokenem GitHub Actions, a taki zapis nie uruchamia innych akcji,
  # więc publikujemy po zakończeniu importu.
  workflow_run:
    workflows: ['Import Tatoeba', 'Import Wiktionary']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
