# Import fraz z Tatoeba. Uruchamiasz ręcznie: zakładka Actions -> "Import Tatoeba" -> Run workflow.
# Nowe i zmienione frazy trafiają od razu do gałęzi main (frazy "zweryfikowane" nigdy nie są nadpisywane).
name: Import Tatoeba

on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Języki (puste = wszystkie), np. "fr es"'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: npm ci
      - run: npm run import:tatoeba -- ${{ github.event.inputs.languages }}
      - run: npm run content
      - run: npm test
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then echo "Bez zmian."; exit 0; fi
          git commit -m "Import fraz z Tatoeba"
          git push
