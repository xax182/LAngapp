      - key: i-drink-coffee
        match: ["I drink coffee.", "I like coffee."]
      - key: do-you-want-tea
        match: ["Do you want some tea?", "Would you like some tea?", "Do you want tea?"]
  - id: 8
    title: Rozmowa
    items:
      - key: really
        match: ["Really?"]
      - key: of-course
        match: ["Of course.", "Of course!", "Sure."]
      - key: i-think-so
        match: ["I think so."]
      - key: i-dont-think-so
        match: ["I don't think so."]
      - key: thats-right
        match: ["That's right.", "That's right!", "Right."]
      - key: no-way
        match: ["No way!"]
      - key: me-too
        match: ["Me too.", "Me, too."]
      - key: its-ok
        match: ["It's OK.", "It's okay.", "That's OK.", "That's okay."]
      - key: great
        match: ["Great!", "Excellent!", "Wonderful!"]
  - id: 9
    title: Czas i plany
    items:
      - key: today
        match: ["Today."]
      - key: tomorrow
        match: ["Tomorrow."]
      - key: what-are-you-doing
        match: ["What are you doing?"]
      - key: lets-go
        match: ["Let's go.", "Let's go!"]
      - key: see-you-later
        match: ["See you later.", "See you later!", "See you."]
      - key: im-busy
        match: ["I'm busy.", "I am busy."]
      - key: i-have-time
        match: ["I have time."]
      - key: come-here
        match: ["Come here.", "Come here!"]
  - id: 10
    title: Uczucia i stan
    items:
      - key: im-happy
        match: ["I'm happy.", "I am happy."]
      - key: im-cold
        match: ["I'm cold.", "I am cold."]
      - key: its-hot
        match: ["It's hot.", "It's hot today."]
      - key: i-love-you
        match: ["I love you."]
      - key: i-miss-you
        match: ["I miss you."]
      - key: dont-worry
        match: ["Don't worry.", "Don't worry!", "Don't worry about it."]
      - key: congratulations
        match: ["Congratulations!", "Congratulations."]
      - key: good-luck
        match: ["Good luck!", "Good luck."]
